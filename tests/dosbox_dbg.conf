[sdl]
output=surface
[cpu]
core=auto
cputype=pentium_mmx
cycles=max
[autoexec]
rem Manual visual-debug launcher (not used by automation). Launch from the repo
rem root; set the D: mount to your local Watcom 9.5a install directory.
mount E "tests"
mount D "C:\WATCOM"
set PATH=Z:\;D:\BIN
E:
cd out
TEST.EXE > test.out
echo done > done.txt
exit
