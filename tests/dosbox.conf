[sdl]
output=surface
[cpu]
core=auto
cputype=pentium_mmx
cycles=max
[autoexec]
mount C "src"
mount E "tests"
mount D "C:\WATCOM"
mount F "libs"
C:
if not exist E:\out md E:\out
if not exist E:\out\obj md E:\out\obj
set WATCOM=D:\
set PATH=Z:\;D:\BIN;D:\BINB
set INCLUDE=D:\H
set CF=-bt=dos4g -3s -ms -s -zp4 -i=include -i=E:\include -i=F:\ailv3
E:\build.bat
